[project]
name = "pinecone-assistant-mcp"
version = "1.0.0"
description = "Generic MCP server for document research using Pinecone Assistant API - Zero-token conversational research with customizable domains"
authors = [
    { name = "John Walkoe" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.1.2",
    "pinecone>=5.0.0",
    "pinecone-plugin-assistant>=1.0.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "detect-secrets>=1.5.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
pinecone-assistant-mcp = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "detect-secrets>=1.5.0",
    "pre-commit>=3.5.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]